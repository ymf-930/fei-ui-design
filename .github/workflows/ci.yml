name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 校验与构建 (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # engines.node 声明 >=20，此处把「声明底线 + 仍受安全支持的 LTS 线」都验证一遍：
        #   20 = 声明的最低版本（已于 2026-04 EOL，仅作兼容性验证）
        #   22 / 24 = 仍在支持期内的 LTS
        # 注：js-beautify → nopt / abbrev 声明 engines.node >=22.22.2。
        # 若 Node 20 这一档出现异常，说明应把 engines.node 提升到 >=22.22.2。
        node-version: [20, 22, 24]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 版本以 package.json 的 packageManager 字段为准，不在此处另行指定
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 代码风格检查
        run: pnpm run lint:check

      # TODO(type-debt): 严格模式类型检查目前仍有历史遗留错误，
      # 详见 docs/.internal/refactor-plan.md 的「类型安全」章节（阶段五）。
      # 暂时不阻断流水线，待存量错误清零后移除 continue-on-error。
      - name: 类型检查（暂不阻断）
        continue-on-error: true
        run: pnpm run type-check

      - name: 单元测试
        run: pnpm run test

      - name: 构建组件库与样式
        run: pnpm run build:package

      - name: 校验产物完整性
        run: pnpm run verify:dist

      - name: 消费方冒烟测试（真实 vite 构建 + SSR）
        run: pnpm run smoke

      - name: 校验发布包内容
        run: |
          pnpm pack --pack-destination /tmp
          tar -tzf /tmp/fei-ui-design-*.tgz | head -30

  docs:
    name: 文档站点构建
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          # 文档站与发布统一跟随 .nvmrc；兼容性下限由 verify 任务的 20 档覆盖
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 文档一致性校验（API / 死链 / 示例 / 格式）
        run: pnpm run docs:check

      - name: 构建文档站点
        run: pnpm run build:site

      # 校验产物：页面是否齐全、站内链接在纯静态托管上能否命中。
      # 必须在 build:site 之后运行（依赖 site/ 产物）。
      # 这一步专门覆盖 docs:check 的盲区：themeConfig.nav / sidebar
      # 以及主题组件里手写的 <a href> 不在 markdown 死链检查范围内。
      - name: 校验站点产物链接
        run: pnpm run docs:check-site

      # 覆盖另一个产物盲区：代码块底色与语法着色主题是两处独立配置，
      # 不配套时会出现「深字压深底」—— 构建成功、页面也不缺内容，
      # 但代码几乎不可读。docs:check 四件套都不看颜色，只能靠产物度量。
      - name: 校验代码块对比度
        run: pnpm run docs:check-contrast
