name: Release

# 打 tag（如 v0.0.3）即自动构建、校验并发布到 npm
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: 构建并发布 npm 包
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 版本以 package.json 的 packageManager 字段为准，不在此处另行指定
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 tag 与 package.json 版本一致
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ($TAG) 与 package.json version ($PKG) 不一致，请先执行 pnpm run release:<patch|minor|major>"
            exit 1
          fi

      - name: 代码风格检查
        run: pnpm run lint:check

      - name: 单元测试
        run: pnpm run test

      - name: 构建组件库与样式
        run: pnpm run build:package

      - name: 校验产物完整性
        run: pnpm run verify

      # 需在仓库 Settings → Secrets 配置 NPM_TOKEN（npm Automation Token）
      # --no-git-checks：CI 处于 tag 上的 detached HEAD，跳过 pnpm 的 git 状态校验
      - name: 发布到 npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
